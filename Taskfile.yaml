---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # Cluster; no default, so every cluster-scoped task must be told which tree to use
  CLUSTER: '{{.CLUSTER}}'
  # Directories
  ANSIBLE_DIR: "{{.ROOT_DIR}}/ansible"
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes/{{.CLUSTER}}"
  SCRIPTS_DIR: "{{.ROOT_DIR}}/scripts"
  # Files
  AGE_FILE: "{{.ROOT_DIR}}/age.key"
  # Only written to, by talos:kubeconfig; reads go through --context
  KUBECONFIG_FILE: "{{.ROOT_DIR}}/kubeconfig-{{.CLUSTER}}"

env:
  # Same list .envrc exports, so tasks still find every cluster when run without direnv.
  # Cluster selection is --context, not this; an exported KUBECONFIG would override it anyway.
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig:{{.ROOT_DIR}}/kubeconfig-main:{{.ROOT_DIR}}/kubeconfig-apollo"
  PYTHONDONTWRITEBYTECODE: "1"
  SOPS_AGE_KEY_FILE: "{{.AGE_FILE}}"
  VIRTUAL_ENV: "{{.ROOT_DIR}}/.venv"

includes:
  ansible: .taskfiles/Ansible/Taskfile.yaml
  kubernetes:
    aliases: ["k8s"]
    taskfile: .taskfiles/Kubernetes/Taskfile.yaml
  flux: .taskfiles/Flux/Taskfile.yaml
  sops: .taskfiles/Sops/Taskfile.yaml
  talos: .taskfiles/Talos/Taskfile.yaml
  user:
    taskfile: .taskfiles/User
    optional: true

tasks:

  default: task -l
