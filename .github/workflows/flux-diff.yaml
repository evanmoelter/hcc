---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Local"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Flux Local Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v47.0.1
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.sha }}
          files: |
            kubernetes/**
            .github/workflows/flux-diff.yaml
            .github/scripts/**

      - name: Test flate diff formatter
        run: python3 .github/scripts/test_format_flate_diff.py

  test:
    name: Flux Local Test (${{ matrix.cluster }})
    needs: pre-job
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: ["main"]
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.0.1
        with:
          args: >-
            test
            --enable-helm
            --all-namespaces
            --path /github/workspace/kubernetes/${{ matrix.cluster }}/flux
            -v

  diff:
    name: Flux Local Diff (${{ matrix.cluster }}, ${{ matrix.resources }})
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        cluster: ["main"]
        resources: ["helmrelease", "kustomization"]
        include:
          - cluster: "main"
            source: "home-kubernetes"
      max-parallel: 4
      fail-fast: false
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: pull

      - name: Checkout Base Branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: "${{ github.event.pull_request.base.sha }}"
          path: default

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.0.1
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/kubernetes/${{ matrix.cluster }}/flux
            --path-orig /github/workspace/default/kubernetes/${{ matrix.cluster }}/flux
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "${{ matrix.source }}"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |
          cat diff.patch;
          {
              echo 'diff<<EOF'
              cat diff.patch
              echo EOF
          } >> "$GITHUB_OUTPUT";
          {
              echo "### ${{ matrix.cluster }} ${{ matrix.resources }} Diff"
              echo '```diff'
              cat diff.patch
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.cluster }}/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ### ${{ matrix.cluster }} ${{ matrix.resources }} changes
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flate:
    name: Flate (apollo)
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""

      - name: Run flate test
        run: flate test all --path ./kubernetes/apollo/flux

      - name: Run flate diff
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          if git cat-file -e "${BASE_SHA}:kubernetes/apollo/flux" 2>/dev/null; then
            flate diff all --base "$BASE_SHA" --path ./kubernetes/apollo/flux --output diff \
              > "$RUNNER_TEMP/flate-diff.patch"
            python3 .github/scripts/format_flate_diff.py "$RUNNER_TEMP/flate-diff.patch" \
              > "$RUNNER_TEMP/flate-diff.md"
            cat "$RUNNER_TEMP/flate-diff.md" >> "$GITHUB_STEP_SUMMARY"
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          else
            echo "No apollo tree at ${BASE_SHA} yet; nothing to diff against." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add Comment
        if: ${{ steps.diff.outputs.generated == 'true' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/apollo/flate"
          message-path: ${{ runner.temp }}/flate-diff.md

  flux-local-status:
    name: Flux Local Success
    needs: ["pre-job", "test", "diff", "flate"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
