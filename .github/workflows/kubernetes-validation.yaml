---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Kubernetes Validation"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pre-job:
    name: Kubernetes Validation Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891 # v47.0.1
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.sha }}
          files: |
            kubernetes/**
            scripts/kubeconform.sh
            scripts/lint-apollo.sh
            policy/**
            mise.toml
            Taskfile.yaml
            .taskfiles/Kubernetes/Taskfile.yaml
            tests/**
            .github/workflows/kubernetes-validation.yaml

  kubeconform:
    name: Kubeconform (${{ matrix.cluster }})
    needs: pre-job
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: ["main", "apollo"]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Setup Workflow Tools
        run: brew install fluxcd/tap/flux kubeconform kustomize

      - name: Run kubeconform
        shell: bash
        run: bash ./scripts/kubeconform.sh ./kubernetes/${{ matrix.cluster }}

  component-tests:
    name: Component Tests
    needs: pre-job
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1

      - name: Setup Test Tools
        run: brew install fluxcd/tap/flux kubeconform kustomize yq

      - name: Setup Policy Tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: aqua:open-policy-agent/conftest aqua:go-task/task
          env: false

      - name: Lint Apollo manifests
        run: task kubernetes:lint CLUSTER=apollo

      - name: Test component rendering and lifecycle
        run: python3 -m unittest discover -s tests

  kubeconform-status:
    name: Kubeconform Success
    needs: ["pre-job", "kubeconform", "component-tests"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped"
