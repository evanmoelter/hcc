apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm: {}
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm: {}
      lockToState: true
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 60GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm: {}
      lockToState: true
provisioning:
  diskSelector:
    match: system_disk
  minSize: 100GiB
  grow: true
filesystem:
  type: xfs
