apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn-sata
provisioning:
  diskSelector:
    match: disk.transport == "sata" && !disk.rotational && !system_disk
  grow: true
filesystem:
  type: xfs
---
machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn-sata
        type: bind
        source: /var/mnt/longhorn-sata
        options: ["bind", "rshared", "rw"]
