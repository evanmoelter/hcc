---
# yaml-language-server: $schema=https://www.schemastore.org/helmfile.json
helmDefaults:
  cleanupOnFail: true
  timeout: 600
  wait: true
  waitForJobs: true

repositories:
  - name: cilium
    url: https://helm.cilium.io

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.1
    values: ["../apps/kube-system/cilium/app/helm/values.yaml"]

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.59.0
    needs: ["kube-system/cilium"]
