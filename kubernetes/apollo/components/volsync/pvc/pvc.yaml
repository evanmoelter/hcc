# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${CLAIM:-${APP}}
  labels:
    volsync.home.arpa/claim: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${VOLSYNC_STORAGECLASS:-longhorn}
  resources:
    requests:
      storage: ${VOLSYNC_CAPACITY}
