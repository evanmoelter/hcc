# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: ${APP}-bootstrap-${VOLSYNC_RESTORE_ID}
spec:
  trigger:
    manual: ${VOLSYNC_RESTORE_ID}
  restic:
    repository: ${APP}-volsync-restore-${VOLSYNC_RESTORE_ID}
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapclass
    storageClassName: ${VOLSYNC_STORAGECLASS:-longhorn}
    accessModes: [ReadWriteOnce]
    capacity: ${VOLSYNC_CAPACITY}
    cacheCapacity: ${VOLSYNC_CACHE_CAPACITY:-1Gi}
    cacheAccessModes: [ReadWriteOnce]
    cleanupCachePVC: true
    # Longhorn clones still need this volume: https://github.com/backube/volsync/issues/1504
    cleanupTempPVC: false
    moverSecurityContext:
      runAsUser: ${VOLSYNC_UID:-568}
      runAsGroup: ${VOLSYNC_GID:-568}
      runAsNonRoot: true
      fsGroup: ${VOLSYNC_GID:-568}
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1Gi
