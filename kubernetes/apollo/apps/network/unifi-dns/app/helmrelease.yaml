# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-dns
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.22.0
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext: &containerSecurityContext
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    triggerLoopOnEvent: true
    policy: sync
    registry: txt
    txtOwnerId: apollo-unifi
    txtPrefix: k8s.apollo.unifi.%{record_type}-
    annotationPrefix: external-dns.alpha.kubernetes.io/
    gatewayNamespace: network
    domainFilters:
      - "${SECRET_DOMAIN}"
    sources:
      - gateway-httproute
      - service
    extraArgs:
      - --service-type-filter=LoadBalancer
    serviceMonitor:
      enabled: true
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.12@sha256:5338b99662e2e15048b4e14b49e17279d384970fdcb3c29169f509f806f49cbe
        env:
          - name: UNIFI_HOST
            value: https://192.168.4.1
          - name: UNIFI_SITE
            value: default
          - name: UNIFI_SKIP_TLS_VERIFY
            value: "true"
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: unifi-dns-secret
                key: UNIFI_API_KEY
        securityContext: *containerSecurityContext
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
