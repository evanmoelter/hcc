# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app envoy-gateway-config
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: envoy-gateway-certificates
    - name: cilium-config
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apollo/apps/network/envoy-gateway/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: >-
        status.conditions.exists(e, e.type == 'Programmed' && e.status == 'True' &&
        e.observedGeneration == metadata.generation)
  interval: 30m
  retryInterval: 1m
  timeout: 10m
