# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.22.0
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    triggerLoopOnEvent: true
    policy: upsert-only
    registry: txt
    txtOwnerId: apollo
    txtPrefix: k8s.apollo.cloudflare.
    annotationPrefix: external-dns-cloudflare.kubernetes.io/
    gatewayNamespace: network
    domainFilters:
      - "${SECRET_DOMAIN}"
    sources:
      - gateway-httproute
    extraArgs:
      - --cloudflare-proxied
      - --cloudflare-dns-records-per-page=1000
      - --gateway-name=envoy-external
      - --exclude-domains=external-apollo.${SECRET_DOMAIN}
    serviceMonitor:
      enabled: true
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-dns-secret
            key: CF_API_TOKEN
