---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cilium/ks.yaml
  - ./cilium/ks-config.yaml
  - ./metrics-server/ks.yaml
  - ./metrics-server/ks-monitoring.yaml
  - ./multus/ks.yaml
  - ./multus/ks-config.yaml
  - ./reloader/ks.yaml
  - ./spegel/ks.yaml
components:
  - ../../components/namespace
patches:
  - path: ./namespace.yaml
    target:
      kind: Namespace
      name: not-used
    options:
      allowNameChange: true
