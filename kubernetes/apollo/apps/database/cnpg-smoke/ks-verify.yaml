# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-smoke-verify
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg-smoke-cluster
      readyExpr: >-
        dep.metadata.labels['cnpg-rehearsal.home.arpa/stage'] == 'restore' &&
        dep.metadata.generation == dep.status.observedGeneration &&
        dep.status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  targetNamespace: database
  path: ./kubernetes/apollo/apps/database/cnpg-smoke/verify
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 30m
