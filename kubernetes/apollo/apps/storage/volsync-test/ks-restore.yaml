# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-test-restore
  namespace: flux-system
spec:
  dependsOn:
    - name: volsync-test-preflight
    - name: volsync
    - name: longhorn-config
  targetNamespace: storage
  path: ./kubernetes/apollo/apps/storage/volsync-test/restore
  components:
    - ../../../../components/volsync/restore
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      current: >-
        has(status) && has(status.lastManualSync) &&
        status.lastManualSync == spec.trigger.manual &&
        has(status.latestImage) && has(status.latestImage.name)
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: volsync-test
      CLAIM: "volsync-test-restored"
      VOLSYNC_CAPACITY: "128Mi"
      VOLSYNC_CACHE_CAPACITY: "128Mi"
      VOLSYNC_RESTORE_ID: "v1"
