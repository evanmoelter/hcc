# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-test-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn-config
  targetNamespace: storage
  path: ./kubernetes/apollo/apps/storage/volsync-test/storage
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      current: >-
        has(status.phase) && status.phase == 'Bound' &&
        (metadata.name != 'volsync-test-restored-v2' ||
          (has(spec.dataSourceRef) &&
           has(spec.dataSourceRef.apiGroup) && spec.dataSourceRef.apiGroup == 'volsync.backube' &&
           spec.dataSourceRef.kind == 'ReplicationDestination' &&
           spec.dataSourceRef.name == 'volsync-test-bootstrap-v2'))
  interval: 30m
  retryInterval: 1m
  timeout: 20m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-test-backup
  namespace: flux-system
spec:
  dependsOn:
    - name: volsync-test
    - name: volsync
    - name: onepassword-store
  targetNamespace: storage
  path: ./kubernetes/apollo/components/volsync/backup
  patches:
    - target:
        group: volsync.backube
        kind: ReplicationSource
      patch: |-
        - op: replace
          path: /spec/trigger
          value:
            manual: v2
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      current: >-
        has(status.lastManualSync) &&
        status.lastManualSync == spec.trigger.manual
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: volsync-test
      CLAIM: "volsync-test-restored-v2"
      VOLSYNC_CACHE_CAPACITY: "128Mi"
      VOLSYNC_REPOSITORY_PATH: volsync-test/app
