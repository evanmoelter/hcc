# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-test-backup
  namespace: flux-system
spec:
  dependsOn:
    - name: volsync-test-seed
    - name: volsync
    - name: onepassword-store
  targetNamespace: storage
  path: ./kubernetes/apollo/apps/storage/volsync-test/backup
  components:
    - ../../../../components/volsync/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      current: >-
        has(status.lastManualSync) &&
        status.lastManualSync == spec.trigger.manual
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: volsync-test
      CLAIM: "volsync-test-source"
      VOLSYNC_CACHE_CAPACITY: "128Mi"
