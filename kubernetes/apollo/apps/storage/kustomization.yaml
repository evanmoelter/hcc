# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./longhorn/ks.yaml
  - ./longhorn/ks-config.yaml
  - ./snapshot-controller/ks.yaml
  - ./snapshot-controller/ks-config.yaml
  - ./volsync/ks.yaml
components:
  - ../../components/namespace
patches:
  - path: ./namespace.yaml
    target:
      kind: Namespace
      name: not-used
    options:
      allowNameChange: true
