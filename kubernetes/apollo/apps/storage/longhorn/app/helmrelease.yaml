# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app longhorn
spec:
  interval: 30m
  timeout: 15m
  releaseName: *app
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: *app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
      defaultDataLocality: best-effort
      dataEngine: v1
    preUpgradeChecker:
      jobEnabled: false
    csi:
      kubeletRootDir: /var/lib/kubelet
    defaultSettings:
      createDefaultDiskLabeledNodes: true
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: 3
      defaultDataLocality: best-effort
      replicaAutoBalance: best-effort
      replicaSoftAntiAffinity: false
      storageOverProvisioningPercentage: 100
      storageMinimalAvailablePercentage: 25
      v1DataEngine: true
      v2DataEngine: false
    longhornManager:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
    metrics:
      serviceMonitor:
        enabled: true
