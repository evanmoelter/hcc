# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app longhorn-config
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apollo/apps/storage/longhorn/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: longhorn.io/v1beta2
      kind: Node
      current: >-
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
        spec.disks.all(d, d in status.diskStatus &&
          status.diskStatus[d].conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
          status.diskStatus[d].conditions.exists(e, e.type == 'Schedulable' && e.status == 'True'))
  interval: 30m
  retryInterval: 1m
  timeout: 15m
