# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app volsync
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RemediateOnFailure
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RemediateOnFailure
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  values:
    manageCRDs: true
    metrics:
      disableAuth: true
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      runAsNonRoot: true
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: null
        memory: 1Gi
