# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
    cleanupOnFail: true
  values:
    global:
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2025.10.3
        digest: sha256:d2b66e851246e7299219b72a4ed43630a2c2bac3745eb665834b72963d836e64
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      deploymentStrategy:
        type: RollingUpdate
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: TZ
          value: ${TIMEZONE}
        - name: TMPDIR
          value: /tmp
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: &dbSecret authentik-pg-app
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: *dbSecret
              key: password
      envFrom:
        - secretRef:
            name: authentik-secret
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-ca
          secret:
            secretName: authentik-pg-ca
            items:
              - key: ca.crt
                path: ca.crt
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: postgres-ca
          mountPath: /etc/postgresql
          readOnly: true
    authentik:
      log_level: info
      error_reporting:
        enabled: false
        send_pii: false
      postgresql:
        host: authentik-pg-rw.security.svc.cluster.local
        name: *app
        sslmode: verify-full
        sslrootcert: /etc/postgresql/ca.crt
      email:
        host: smtp-relay.gmail.com
        port: 587
        use_tls: true
        from: sso@${SECRET_DOMAIN}
      listen:
        trusted_proxy_cidrs: 10.42.0.0/16,127.0.0.1/32,::1/128
    server:
      replicas: 1
      autoscaling:
        enabled: false
      serviceAccountName: *app
      containerSecurityContext: &containerSecurityContext
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources: &resources
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
      metrics: &metrics
        enabled: true
        serviceMonitor:
          enabled: true
      route:
        internal:
          enabled: true
          hostnames:
            - sso.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
          filters: &proxyHeaders
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Forwarded-For
                    value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                  - name: X-Forwarded-Proto
                    value: https
                  - name: X-Forwarded-Host
                    value: sso.${SECRET_DOMAIN}
                remove:
                  - Forwarded
                  - X-Real-IP
                  - X-Forwarded-Scheme
                  - SSL-Client-Cert
                  - X-Forwarded-TLS-Client-Cert
                  - X-Forwarded-Client-Cert
        external:
          enabled: true
          hostnames:
            - sso.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-external
              namespace: network
              sectionName: https
          filters: *proxyHeaders
    worker:
      replicas: 1
      autoscaling:
        enabled: false
      serviceAccountName: *app
      containerSecurityContext: *containerSecurityContext
      resources: *resources
      metrics: *metrics
    serviceAccount:
      create: false
    postgresql:
      enabled: false
