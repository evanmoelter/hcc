# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: remove
        path: /metadata/annotations/cnpg.io~1skipEmptyWalArchiveCheck
      - op: replace
        path: /spec/bootstrap
        value:
          initdb:
            database: authentik
            owner: authentik
            import:
              type: microservice
              databases:
                - authentik
              source:
                externalCluster: authentik-main
      - op: replace
        path: /spec/externalClusters
        value:
          - name: authentik-main
            connectionParameters:
              host: 192.168.6.21
              port: "5432"
              user: authentik
              dbname: authentik
              sslmode: require
            password:
              name: authentik-postgres-migration
              key: password
      - op: add
        path: /spec/postgresql
        value:
          parameters:
            max_connections: "200"
