# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: longhorn-config
  targetNamespace: security
  path: ./kubernetes/apollo/apps/security/authentik/storage
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      current: has(status.phase) && status.phase == 'Bound'
  interval: 30m
  retryInterval: 1m
  timeout: 30m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-backup
  namespace: flux-system
spec:
  dependsOn:
    - name: authentik
    - name: volsync
    - name: onepassword-store
  targetNamespace: security
  path: ./kubernetes/apollo/components/volsync/backup
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: authentik
      CLAIM: authentik-data
  patches:
    - target:
        group: volsync.backube
        kind: ReplicationSource
      patch: |-
        - op: add
          path: /spec/restic/accessModes
          value: [ReadWriteOnce]
