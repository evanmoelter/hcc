# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-explorer-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
  - secretKey: EXPLORER_API_TOKEN
    remoteRef:
      key: k8s-explorer
      property: EXPLORER_API_TOKEN
  - secretKey: EXPLORER_EMBEDDING_API_KEY
    remoteRef:
      key: k8s-explorer
      property: EXPLORER_EMBEDDING_API_KEY
