# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: k8s-explorer-serving-check-v1
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 9000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-explorer-verify
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: hcc8
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runner
        image: ghcr.io/evanmoelter/k8s-at-home-explorer:sha-5eed2805d945094dcc5ae13e3a9ee2fdfcbcd445@sha256:d086f167dcd9c746e1272a1f7d24e089f6b3d8331ef81f7255190da86aafb900
        command:
        - python
        - /validation/verify.py
        env:
        - name: EXPLORER_HOST
          value: 0.0.0.0
        - name: EXPLORER_CORPUS_DIR
          value: /data/corpus
        - name: EXPLORER_REPOSITORIES_FILE
          value: /config/repositories.yaml
        - name: EXPLORER_ALLOWED_HTTP_HOSTS
          value: '["explorer.${SECRET_DOMAIN}","k8s-explorer","k8s-explorer.default.svc.cluster.local","localhost","127.0.0.1"]'
        - name: EXPLORER_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: k8s-explorer-pg-app
              key: uri
        - name: EXPLORER_EMBEDDING_PROTOCOL
          value: voyage
        - name: EXPLORER_EMBEDDING_URL
          value: https://api.voyageai.com/v1/embeddings
        - name: EXPLORER_EMBEDDING_MODEL
          value: voyage-4
        - name: EXPLORER_EMBEDDING_DIMENSIONS
          value: '1024'
        - name: EXPLORER_EMBEDDING_REQUESTED_DIMENSIONS
          value: '1024'
        - name: EXPLORER_EMBEDDING_API_KEY
          valueFrom:
            secretKeyRef:
              name: k8s-explorer-credentials
              key: EXPLORER_EMBEDDING_API_KEY
        - name: PGSSLMODE
          value: require
        - name: EXPLORER_REFRESH_METADATA
          value: 'false'
        - name: EXPLORER_FETCH_WORKERS
          value: '2'
        - name: TZ
          value: ${TIMEZONE}
        - name: EXPLORER_SYNC_INTERVAL
          value: '3600'
        - name: EXPLORER_SMOKE_URL
          value: https://explorer.${SECRET_DOMAIN}/mcp
        - name: EXPLORER_SMOKE_TOKEN
          valueFrom:
            secretKeyRef:
              name: k8s-explorer-credentials
              key: EXPLORER_API_TOKEN
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: validation
          mountPath: /validation
          readOnly: true
        - name: corpus
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: k8s-explorer-catalogue
      - name: validation
        configMap:
          name: k8s-explorer-serving-check
      - name: corpus
        persistentVolumeClaim:
          claimName: k8s-explorer-corpus
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
