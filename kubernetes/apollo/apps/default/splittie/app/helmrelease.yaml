# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app splittie
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    cleanupOnFail: true
  values:
    controllers:
      splittie:
        type: cronjob
        cronjob:
          suspend: true
          schedule: "*/30 * * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 60
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 604800
        pod:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: splittie-ghcr
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/evanmoelter/splittie
              tag: sha-b16367ab2fc78832129cc1e1b7349e2da6fd915c@sha256:26aba8bf9a99360a4e749ffca62415160754f6ef3b927a87483f7d52712a1871
            args: [run, --dry-run]
            env:
              TZ: ${TIMEZONE}
              SPLITTIE_CONFIG: /config/splittie.yaml
              YNAB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: YNAB_TOKEN
              PUSHOVER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: PUSHOVER_TOKEN
              PUSHOVER_USER:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: PUSHOVER_USER
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: splittie-pg-app
                    key: uri
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      config:
        type: secret
        name: *app
        items:
          - key: splittie.yaml
            path: splittie.yaml
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
