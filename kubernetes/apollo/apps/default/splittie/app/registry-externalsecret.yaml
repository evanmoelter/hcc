# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splittie-ghcr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"auth":{{ printf "%s:%s" .username .password | b64enc | toJson }}}}}
  data:
    - secretKey: username
      remoteRef:
        key: splittie-ghcr
        property: username
    - secretKey: password
      remoteRef:
        key: splittie-ghcr
        property: password
