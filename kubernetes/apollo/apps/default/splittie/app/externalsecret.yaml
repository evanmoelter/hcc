# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splittie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        YNAB_TOKEN: "{{ .YNAB_TOKEN }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER }}"
        splittie.yaml: |-
          writeCap: 50
          budgets:
            a:
              name: {{ .BUDGET_A | toJson }}
            b:
              name: {{ .BUDGET_B | toJson }}
          syncs:
            - name: primary
              startDate: {{ .START_DATE | toJson }}
              payee: {{ .PAYEE_MODE | toJson }}
              sides:
                - budget: a
                  account: {{ .ACCOUNT_A | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_A | toJson }}
                - budget: b
                  account: {{ .ACCOUNT_B | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_B | toJson }}
  dataFrom:
    - extract:
        key: splittie
