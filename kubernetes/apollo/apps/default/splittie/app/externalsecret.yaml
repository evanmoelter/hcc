# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splittie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        YNAB_TOKEN: "{{ .YNAB_TOKEN }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_API_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER_KEY }}"
        splittie.yaml: |-
          writeCap: {{ index . "WRITE_CAP" | default "50" | atoi }}
          budgets:
            a:
              name: {{ .BUDGET_A | toJson }}
              placeholderCategory: { group: Joint, name: Auto }
            b:
              name: {{ .BUDGET_B | toJson }}
          syncs:
            - name: primary
              startDate: {{ .START_DATE | toJson }}
              payee: {{ .PAYEE_MODE | toJson }}
              sides:
                - budget: a
                  account: {{ .ACCOUNT_A | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_A | toJson }}
                - budget: b
                  account: {{ .ACCOUNT_B | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_B | toJson }}
          rules:
            - name: joint-auto
              budgets: [a]
              startDate: {{ .START_DATE | toJson }}
              phase: beforeSync
              history: true
              when:
                category: { group: Joint, name: Auto }
                kind: { not: split }
              then:
                - split:
                    - share: 100%
                      transfer: {{ .ACCOUNT_A | toJson }}
  dataFrom:
    - extract:
        key: splittie
  data:
    - secretKey: PUSHOVER_API_TOKEN
      remoteRef:
        key: pushover
        property: PUSHOVER_API_TOKEN
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: pushover
        property: PUSHOVER_USER_KEY
