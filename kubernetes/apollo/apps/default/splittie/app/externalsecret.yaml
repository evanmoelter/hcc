# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splittie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        YNAB_TOKEN: "{{ .YNAB_TOKEN }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_API_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER_KEY }}"
        splittie.yaml: |-
          writeCap: {{ index . "WRITE_CAP" | default "50" | atoi }}
          budgets:
            e:
              name: {{ .BUDGET_E | toJson }}
              placeholderCategory: { group: None, name: None }
            k:
              name: {{ .BUDGET_K | toJson }}
              placeholderCategory: { group: None, name: None }
            j:
              name: {{ .BUDGET_J | toJson }}
          syncs:
            - name: e-k
              startDate: {{ .START_DATE | toJson }}
              payee: {{ .PAYEE_MODE | toJson }}
              sides:
                - budget: e
                  account: {{ .ACCOUNT_E_K | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_E_K | toJson }}
                - budget: k
                  account: {{ .ACCOUNT_K_E | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_K_E | toJson }}
            - name: e-j
              startDate: {{ .START_DATE | toJson }}
              payee: {{ .PAYEE_MODE | toJson }}
              sides:
                - budget: e
                  account: {{ .ACCOUNT_E_J | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_E_J | toJson }}
                - budget: j
                  account: {{ .ACCOUNT_J_E | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_J_E | toJson }}
            - name: k-j
              startDate: {{ .START_DATE | toJson }}
              payee: {{ .PAYEE_MODE | toJson }}
              sides:
                - budget: k
                  account: {{ .ACCOUNT_K_J | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_K_J | toJson }}
                - budget: j
                  account: {{ .ACCOUNT_J_K | toJson }}
                  mirrorPayee: {{ .MIRROR_PAYEE_J_K | toJson }}
          rules:
            - name: joint-auto-e
              budgets: [e]
              startDate: {{ .START_DATE | toJson }}
              phase: beforeSync
              history: true
              when:
                category: { group: Joint, name: Auto }
                approved: true
                kind: { not: split }
              then:
                - split:
                    - share: 100%
                      transfer: {{ .ACCOUNT_E_J | toJson }}
            - name: joint-auto-k
              budgets: [k]
              startDate: {{ .START_DATE | toJson }}
              phase: beforeSync
              history: true
              when:
                category: { group: Joint, name: Auto }
                approved: true
                kind: { not: split }
              then:
                - split:
                    - share: 100%
                      transfer: {{ .ACCOUNT_K_J | toJson }}
  dataFrom:
    - extract:
        key: splittie
  data:
    - secretKey: PUSHOVER_API_TOKEN
      remoteRef:
        key: pushover
        property: PUSHOVER_API_TOKEN
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: pushover
        property: PUSHOVER_USER_KEY
