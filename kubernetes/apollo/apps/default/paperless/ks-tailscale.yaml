# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-tailscale
  namespace: flux-system
spec:
  dependsOn:
    - name: paperless
    - name: tailscale-config
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apollo/apps/default/paperless/tailscale
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      current: >-
        has(status.loadBalancer) && has(status.loadBalancer.ingress) &&
        status.loadBalancer.ingress.exists(e, has(e.hostname) && e.hostname != '')
  interval: 30m
  retryInterval: 1m
  timeout: 10m
