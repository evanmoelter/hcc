# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-restore-preflight
  namespace: flux-system
spec:
  dependsOn:
    - name: onepassword-store
  targetNamespace: default
  path: ./kubernetes/apollo/components/volsync/restore-preflight
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: paperless-library
      VOLSYNC_RESTORE_ID: migration-20260930
      VOLSYNC_RESTORE_BUCKET: tf-hcc-volsync
      VOLSYNC_RESTORE_PATH: paperless-library
      VOLSYNC_RESTORE_R2_CREDENTIALS_ITEM: paperless-library-migration
      VOLSYNC_RESTORE_CREDENTIALS_ITEM: paperless-library-migration
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: paperless-restore-preflight
    - name: volsync
    - name: longhorn-config
  targetNamespace: default
  path: ./kubernetes/apollo/apps/default/paperless/storage
  components:
    - ../../../../components/volsync/restore
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      current: >-
        has(status.phase) && status.phase == 'Bound' &&
        (metadata.name != 'paperless-library' ||
          (has(spec.dataSourceRef) &&
           has(spec.dataSourceRef.apiGroup) && spec.dataSourceRef.apiGroup == 'volsync.backube' &&
           spec.dataSourceRef.kind == 'ReplicationDestination' &&
           spec.dataSourceRef.name == 'paperless-library-bootstrap-migration-20260930'))
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      current: >-
        has(status.lastManualSync) &&
        status.lastManualSync == spec.trigger.manual &&
        has(status.latestImage) && has(status.latestImage.name)
  interval: 30m
  retryInterval: 1m
  timeout: 30m
  postBuild:
    substitute:
      APP: paperless-library
      VOLSYNC_RESTORE_ID: migration-20260930
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-library-backup
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: paperless
    - name: volsync
    - name: onepassword-store
  targetNamespace: default
  path: ./kubernetes/apollo/components/volsync/backup
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: paperless-library
      CLAIM: paperless-library
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
