# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-sftp
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RemediateOnFailure
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  rollback:
    cleanupOnFail: true
  values:
    controllers:
      sftp:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          init-consume:
            image: &image
              repository: docker.io/atmoz/sftp
              tag: alpine@sha256:a81ea210713555be76075b4b2788a4addfaa54d137cd881f3a99ac539f0be2c5
            command: [/bin/sh, -c]
            args:
              - mkdir -p /consume/receipt
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          server:
            image: *image
            command: [/bin/sh, -c]
            args:
              - exec /entrypoint >/dev/null
            env:
              TZ: ${TIMEZONE}
              SFTP_USERS:
                valueFrom:
                  secretKeyRef:
                    name: &secret paperless-sftp-secret
                    key: SFTP_USERS
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
                add: [CHOWN, SETGID, SETUID, SYS_CHROOT, NET_BIND_SERVICE]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      sftp:
        controller: sftp
        annotations:
          external-dns.alpha.kubernetes.io/hostname: paperless-sftp.${SECRET_DOMAIN}
          io.cilium/lb-ipam-ips: 192.168.21.102
        type: LoadBalancer
        ports:
          sftp:
            port: 22
            protocol: TCP
    configMaps:
      sshd:
        data:
          sshd_config: |
            Include /etc/ssh/sshd_config.d/*.conf
            HostKey /etc/ssh/ssh_host_ed25519_key
            HostKey /etc/ssh/ssh_host_rsa_key
            UseDNS no
            PermitRootLogin no
            PasswordAuthentication yes
            PermitEmptyPasswords no
            DisableForwarding yes
            PermitTTY no
            PermitUserRC no
            Subsystem sftp internal-sftp
            ForceCommand internal-sftp
            ChrootDirectory %h
          scanner.conf: |
            KexAlgorithms +diffie-hellman-group14-sha1
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
    externalSecrets:
      sftp:
        forceRename: *secret
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        target:
          creationPolicy: Owner
          deletionPolicy: Retain
        data:
          - secretKey: SFTP_USERS
            remoteRef:
              key: *app
              property: SFTP_USERS
          - secretKey: SSH_KEY_ED25519
            remoteRef:
              key: *app
              property: SSH_KEY_ED25519
          - secretKey: SSH_KEY_RSA
            remoteRef:
              key: *app
              property: SSH_KEY_RSA
    persistence:
      sshd:
        type: configMap
        identifier: sshd
        advancedMounts:
          sftp:
            server:
              - path: /etc/ssh/sshd_config
                subPath: sshd_config
                readOnly: true
              - path: /etc/ssh/sshd_config.d/scanner.conf
                subPath: scanner.conf
                readOnly: true
      host-keys:
        type: secret
        name: *secret
        defaultMode: 0600
        advancedMounts:
          sftp:
            server:
              - path: /etc/ssh/ssh_host_ed25519_key
                subPath: SSH_KEY_ED25519
                readOnly: true
              - path: /etc/ssh/ssh_host_rsa_key
                subPath: SSH_KEY_RSA
                readOnly: true
      consume:
        existingClaim: paperless-consume
        advancedMounts:
          sftp:
            init-consume:
              - path: /consume
            server:
              - path: /home/paperless-sftp/consume
