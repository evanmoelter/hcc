# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-consume-monitor
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    cleanupOnFail: true
  values:
    controllers:
      monitor:
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/library/telegraf
              tag: 1.40.1-alpine@sha256:6606553b5019151de171984e9ce938eac859d6987aa5329c420597737bf1a9a0
            command: [telegraf]
            args: [--config, /config/telegraf.conf]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
    configMaps:
      config:
        includeInChecksum: true
        data:
          telegraf.conf: |-
            [agent]
              interval = "1m"
              flush_interval = "10s"
              omit_hostname = true

            [[inputs.filecount]]
              directories = ["/consume/receipt"]
              name = "[^.]*.[pP][dD][fF]"
              recursive = true
              regular_only = true
              follow_symlinks = false
              mtime = "1h"
              timeout = "10s"

            [[outputs.health]]
              service_address = "http://:8080"
              namepass = ["filecount"]
              default_status = 503
              max_time_between_metrics = "2m"
              [[outputs.health.compares]]
                field = "count"
                eq = 0.0
    service:
      app:
        controller: monitor
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          monitor:
            app:
              - path: /config
                readOnly: true
      consume:
        existingClaim: paperless-consume
        advancedMounts:
          monitor:
            app:
              - path: /consume
                readOnly: true
