# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie-preflight
  namespace: flux-system
spec:
  dependsOn:
    - name: onepassword-store
  targetNamespace: default
  path: ./kubernetes/apollo/components/volsync/restore-preflight
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: mealie
      VOLSYNC_RESTORE_ID: migration-v1
      VOLSYNC_RESTORE_BUCKET: tf-hcc-volsync
      VOLSYNC_RESTORE_PATH: mealie-data
      VOLSYNC_RESTORE_R2_CREDENTIALS_ITEM: mealie-volsync-migration
      VOLSYNC_RESTORE_CREDENTIALS_ITEM: mealie-volsync-migration
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: mealie-preflight
    - name: volsync
    - name: longhorn-config
  targetNamespace: default
  path: ./kubernetes/apollo/apps/default/mealie/storage
  components:
    - ../../../../components/volsync/restore
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  healthCheckExprs:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      current: >-
        has(status.phase) && status.phase == 'Bound' &&
        (metadata.name != 'mealie-data' ||
          (has(spec.dataSourceRef) &&
           has(spec.dataSourceRef.apiGroup) && spec.dataSourceRef.apiGroup == 'volsync.backube' &&
           spec.dataSourceRef.kind == 'ReplicationDestination' &&
           spec.dataSourceRef.name == 'mealie-bootstrap-migration-v1'))
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      current: >-
        has(status.lastManualSync) && status.lastManualSync == spec.trigger.manual &&
        has(status.latestImage) && has(status.latestImage.name)
  interval: 30m
  retryInterval: 1m
  timeout: 30m
  postBuild:
    substitute:
      APP: mealie
      VOLSYNC_RESTORE_ID: migration-v1
      VOLSYNC_CAPACITY: 5Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie-backup
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: mealie
    - name: volsync
    - name: onepassword-store
  targetNamespace: default
  path: ./kubernetes/apollo/components/volsync/backup
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 20m
  postBuild:
    substitute:
      APP: mealie
      CLAIM: mealie-data
