# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  interval: 30m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RemediateOnFailure
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  rollback:
    cleanupOnFail: true
  values:
    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.12.0@sha256:8d962f611390a1cca667eed32a29e9467e9c01c523e2db3ad00f667372067f9d
            env:
              TZ: ${TIMEZONE}
              ALLOW_SIGNUP: "false"
              ALLOW_PASSWORD_LOGIN: "false"
              BASE_URL: https://food.${SECRET_DOMAIN}
              DB_ENGINE: postgres
              POSTGRES_PORT: "5432"
              POSTGRES_DB: mealie
              POSTGRES_SERVER:
                valueFrom:
                  secretKeyRef:
                    name: &dbSecret mealie-pg-app
                    key: host
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: *dbSecret
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *dbSecret
                    key: password
              OIDC_AUTH_ENABLED: "true"
              OIDC_PROVIDER_NAME: authentik
              OIDC_SIGNUP_ENABLED: "true"
              OIDC_CONFIGURATION_URL: https://sso.${SECRET_DOMAIN}/application/o/mealie/.well-known/openid-configuration
              OIDC_AUTO_REDIRECT: "true"
              OIDC_REMEMBER_ME: "true"
              OIDC_ADMIN_GROUP: mealie-admins
              OIDC_USER_GROUP: mealie-users
            envFrom:
              - secretRef:
                  name: mealie-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: mealie
        ports:
          http:
            port: 9000
    persistence:
      data:
        existingClaim: mealie-data
        globalMounts:
          - path: /app/data
      nltk-data:
        type: emptyDir
        globalMounts:
          - path: /nltk_data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
