# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
configMapGenerator:
  - name: k8s-explorer-eval-runner
    behavior: merge
    files:
      - approval.json
      - hosted-runner.py
patches:
  - patch: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: k8s-explorer-eval
      spec:
        template:
          spec:
            containers:
              - name: runner
                command: [python, /config/hosted-runner.py]
