# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-explorer-eval-prepare
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: 'true'
spec:
  dependsOn:
  - name: k8s-explorer-eval-storage
  targetNamespace: default
  path: ./kubernetes/apollo/apps/default/k8s-explorer-eval/prepare
  prune: true
  deletionPolicy: WaitForTermination
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 2h
  healthCheckExprs:
  - apiVersion: batch/v1
    kind: Job
    failed: has(status.failed) && status.failed > 0
    current: (has(spec.suspend) && spec.suspend) || (has(status.succeeded) && status.succeeded
      == 1)
