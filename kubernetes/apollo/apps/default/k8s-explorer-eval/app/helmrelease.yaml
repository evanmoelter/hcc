# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app k8s-explorer-eval
spec:
  interval: 30m
  timeout: 35m
  releaseName: *app
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
  upgrade:
    strategy:
      name: RemediateOnFailure
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: *app
            patch: |-
              - op: add
                path: /spec/progressDeadlineSeconds
                value: 2100
  values:
    controllers:
      tei:
        replicas: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/hostname: hcc8
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          tei:
            image:
              repository: ghcr.io/huggingface/text-embeddings-inference
              tag: cpu-1.9.4@sha256:8419f533857b503ebf6ec292a95d4f1cf9c0464ac8b8abeef39518cf110e5726
            args: [--json-output, --disable-spans]
            env:
              MODEL_ID: Qwen/Qwen3-Embedding-0.6B
              REVISION: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
              POOLING: last-token
              HOSTNAME: 0.0.0.0
              PORT: "8080"
              DTYPE: float32
              HUGGINGFACE_HUB_CACHE: /data/hub
              HF_HOME: /data/hf
              HOME: /tmp
              TMPDIR: /tmp
              MKL_ENABLE_INSTRUCTIONS: AVX2
              OMP_NUM_THREADS: "2"
              MKL_NUM_THREADS: "2"
              RAYON_NUM_THREADS: "2"
              TOKENIZATION_WORKERS: "2"
              MAX_BATCH_TOKENS: "8192"
              MAX_BATCH_REQUESTS: "1"
              MAX_CLIENT_BATCH_SIZE: "32"
              MAX_CONCURRENT_REQUESTS: "32"
              PAYLOAD_LIMIT: "2000000"
              AUTO_TRUNCATE: "true"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: "1"
                memory: 3Gi
              limits:
                cpu: "2"
                memory: 8Gi
    service:
      app:
        controller: tei
        type: ClusterIP
        ports:
          http:
            port: 8080
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            path: /metrics
            interval: 15s
    persistence:
      cache:
        existingClaim: k8s-explorer-eval-cache
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp
