# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./source-objectstore.yaml
  - ./externalsecret.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: replace
        path: /spec/externalClusters
        value:
          - name: home-assistant-pg-backup
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: home-assistant-pg-source
                serverName: home-assistant-pg-v1
      - op: remove
        path: /metadata/annotations/cnpg.io~1skipEmptyWalArchiveCheck
      - op: add
        path: /spec/postgresql
        value:
          parameters:
            max_connections: "100"
            shared_buffers: 128MB
