# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: remove
        path: /metadata/annotations/cnpg.io~1skipEmptyWalArchiveCheck
      - op: replace
        path: /spec/bootstrap
        value:
          initdb:
            database: teslamate
            owner: teslamate
            secret:
              name: teslamate-postgres
            import:
              type: microservice
              databases:
                - teslamate
              source:
                externalCluster: teslamate-main
      - op: replace
        path: /spec/externalClusters
        value:
          - name: teslamate-main
            connectionParameters:
              host: 192.168.6.21
              port: "5432"
              user: teslamate
              dbname: teslamate
              sslmode: require
            password:
              name: teslamate-postgres-migration
              key: password
