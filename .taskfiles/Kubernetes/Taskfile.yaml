---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBECONFORM_SCRIPT: "{{.SCRIPTS_DIR}}/kubeconform.sh"

tasks:

  lint:
    desc: Check explicit Apollo resource policies with Conftest
    cmds:
      - conftest verify --policy {{.ROOT_DIR}}/policy/apollo
      - bash {{.SCRIPTS_DIR}}/lint-apollo.sh {{.KUBERNETES_DIR}}
    preconditions:
      - { msg: "Policy linting requires CLUSTER=apollo", sh: 'test "{{.CLUSTER}}" = apollo' }

  resources:
    desc: Gather common resources in your cluster, useful when asking for support
    cmds:
      - for: { var: resource }
        cmd: kubectl --context {{.CLUSTER}} get {{.ITEM}} {{.CLI_ARGS | default "-A"}}
    preconditions:
      - { msg: "CLUSTER is not set, e.g. CLUSTER=main", sh: 'test -n "{{.CLUSTER}}"' }
    vars:
      resource: >-
        nodes
        gitrepositories
        kustomizations
        helmrepositories
        helmreleases
        certificates
        certificaterequests
        ingresses
        pods

  kubeconform:
    desc: Validate Kubernetes manifests with kubeconform
    cmd: bash {{.KUBECONFORM_SCRIPT}} {{.KUBERNETES_DIR}}
    preconditions:
      - { msg: "CLUSTER is not set, e.g. CLUSTER=main", sh: 'test -n "{{.CLUSTER}}"' }
      - { msg: "Missing kubeconform script", sh: "test -f {{.KUBECONFORM_SCRIPT}}" }
      - { msg: "Missing cluster directory {{.KUBERNETES_DIR}}", sh: "test -d {{.KUBERNETES_DIR}}" }
